syntax = "proto3";

package com.ecommerce.order.bidirectional;

option java_package = "com.ecommerce.order.grpc.bidirectional";
option java_multiple_files = true;

import "google/protobuf/timestamp.proto";

enum ShipmentStatus {
  SHIPMENT_STATUS_UNKNOWN = 0;
  SHIPMENT_STATUS_PENDING = 1;
  SHIPMENT_STATUS_COMBINED = 2;
  SHIPMENT_STATUS_PROCESSING = 3;
  SHIPMENT_STATUS_SHIPPED = 4;
  SHIPMENT_STATUS_CANCELLED = 5;
}

enum TransactionStatus {
  TRANSACTION_STATUS_UNKNOWN = 0;
  TRANSACTION_STATUS_INITIATED = 1;
  TRANSACTION_STATUS_COMMITTED = 2;
  TRANSACTION_STATUS_ROLLED_BACK = 3;
  TRANSACTION_STATUS_FAILED = 4;
}

message Money {
  int64 units = 1;
  int32 nanos = 2;
}

message OrderItem {
  string product_id = 1;
  int32 quantity = 2;
  Money unit_price = 3;
}

message Address {
  string street = 1;
  string city = 2;
  string state = 3;
  string zip_code = 4;
  string country = 5;
}

message OrderProcessingRequest {
  string order_id = 1;
  string user_id = 2;
  repeated OrderItem items = 3;
  Address shipping_address = 4;
  google.protobuf.Timestamp requested_delivery_date = 5;
  string transaction_id = 6;
  string idempotency_key = 7;
  int32 retry_count = 8;
}

message CombinedShipment {
  string shipment_id = 1;
  repeated string order_ids = 2; // Orders combined in this shipment
  google.protobuf.Timestamp delivery_date = 3;
  Address shipping_address = 4;
  ShipmentStatus status = 5;
  Money total_shipping_cost = 6;
  int32 total_items = 7;
  google.protobuf.Timestamp created_at = 8;
  string transaction_id = 9;
  TransactionStatus transaction_status = 10;
}

message ShipmentProcessingResponse {
  string shipment_id = 1;
  repeated string processed_order_ids = 2;
  ShipmentStatus status = 3;
  string message = 4;
  google.protobuf.Timestamp timestamp = 5;
  bool success = 6;
  string transaction_id = 7;
  TransactionStatus transaction_status = 8;

  bool rollback_required = 9;
  repeated string failed_order_ids = 10;
  string rollback_reason = 11;

  bool can_retry = 12;
  int32 retry_attempt = 13;
}

message ShipmentBookingRequest {
  string booking_id = 1;
  string shipment_id = 2;
  repeated string order_ids = 3;
  google.protobuf.Timestamp delivery_date = 4;
  string carrier_id = 5;
  string transaction_id = 6;
}

message ShipmentBookingResponse {
  string booking_id = 1;
  string shipment_id = 2;
  bool confirmed = 3;
  string message = 4;
  google.protobuf.Timestamp booking_expiration = 5;
  string transaction_id = 6;
  TransactionStatus transaction_status = 7;
  bool rollback_required = 8;
}

service BidirectionalOrderProcessingService {
  rpc ProcessOrdersForCombinedShipments (stream OrderProcessingRequest) returns (stream ShipmentProcessingResponse);
  rpc ManageShipmentBookings (stream ShipmentBookingRequest) returns (stream ShipmentBookingResponse);
}