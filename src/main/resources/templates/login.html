<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - TCO Calculator</title>
</head>
<body style="font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f4f9;">

<div style="background: white; padding: 24px; border-radius: 8px; width: 100%; max-width: 400px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
    <h2>Sign In / Register</h2>

    <!-- Form login handled by Spring Security (/auth/login) -->
    <form id="loginForm" method="post" action="/auth/login">
        <div style="margin-bottom: 12px;">
            <label style="display: block; margin-bottom: 4px;">Username</label>
            <input type="text" name="username" required style="width: 100%; padding: 8px; box-sizing: border-box;">
        </div>
        <div style="margin-bottom: 16px;">
            <label style="display: block; margin-bottom: 4px;">Password</label>
            <input type="password" name="password" required style="width: 100%; padding: 8px; box-sizing: border-box;">
        </div>
        <button type="submit" style="width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; margin-bottom: 10px;">
            Login
        </button>
    </form>

    <hr style="margin: 20px 0; border: 0; border-top: 1px solid #ddd;">

    <!-- Optional: Separate button or logic if you want an explicit registration step first -->
    <p style="font-size: 0.85rem; color: #666; text-align: center;">
        Don't have an account? Register via your API or contact your administrator.
    </p>
</div>
</body>
</html>
