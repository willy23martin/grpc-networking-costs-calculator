syntax = "proto3";

package com.ecommerce.order.serverstreaming;

option java_package = "com.ecommerce.order.grpc.serverstreaming";
option java_multiple_files = true;

import "google/protobuf/timestamp.proto";

enum OrderStatus {
  ORDER_STATUS_UNKNOWN = 0;
  ORDER_STATUS_PENDING = 1;
  ORDER_STATUS_PROCESSING = 2;
  ORDER_STATUS_SHIPPED = 3;
  ORDER_STATUS_DELIVERED = 4;
  ORDER_STATUS_CANCELLED = 5;
}

message Money {
  int64 units = 1;
  int32 nanos = 2;
}

message SearchOrdersRequest {
  string query = 1;
  OrderStatus status_filter = 2;
  google.protobuf.Timestamp start_date = 3;
  google.protobuf.Timestamp end_date = 4;
  Money min_amount = 5;
}

message OrderSummary {
  string order_id = 1;
  string user_id = 2;
  Money total_amount = 3;
  google.protobuf.Timestamp order_date = 4;
  OrderStatus status = 5;
  string tracking_number = 6;
}

service OrderSearchService {
  rpc SearchOrders (SearchOrdersRequest) returns (stream OrderSummary);
}