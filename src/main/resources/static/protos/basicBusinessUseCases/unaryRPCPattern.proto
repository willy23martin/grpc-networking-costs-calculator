syntax = "proto3";

package com.ecommerce.order.unary;

option java_package = "com.ecommerce.order.grpc.unary";
option java_multiple_files = true;

import "google/protobuf/timestamp.proto";

enum OrderStatus {
  ORDER_STATUS_UNKNOWN = 0;
  ORDER_STATUS_PENDING = 1;
  ORDER_STATUS_PROCESSING = 2;
  ORDER_STATUS_SHIPPED = 3;
  ORDER_STATUS_DELIVERED = 4;
  ORDER_STATUS_CANCELLED = 5;
}

message Money {
  int64 units = 1;
  int32 nanos = 2;
}

message OrderItem {
  string product_id = 1;
  int32 quantity = 2;
  Money unit_price = 3;
}

message Address {
  string street = 1;
  string city = 2;
  string state = 3;
  string zip_code = 4;
  string country = 5;
}

message Order {
  string order_id = 1;
  string user_id = 2;
  repeated OrderItem items = 3;
  Money total_amount = 4;
  google.protobuf.Timestamp order_date = 5;
  OrderStatus status = 6;
  Address shipping_address = 7;
}

message GetOrderRequest {
  string order_id = 1;
}

service UnaryOrderService {
  rpc GetOrderDetails (GetOrderRequest) returns (Order);
}