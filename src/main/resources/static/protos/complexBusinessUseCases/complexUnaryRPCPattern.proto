syntax = "proto3";

package com.ecommerce.order.unary;

option java_package = "com.ecommerce.order.grpc.unary";
option java_multiple_files = true;

import "google/protobuf/timestamp.proto";

enum OrderStatus {
  ORDER_STATUS_UNKNOWN = 0;
  ORDER_STATUS_PENDING = 1;
  ORDER_STATUS_PROCESSING = 2;
  ORDER_STATUS_SHIPPED = 3;
  ORDER_STATUS_DELIVERED = 4;
  ORDER_STATUS_CANCELLED = 5;
}

enum ProductCategory {
  PRODUCT_CATEGORY_UNKNOWN = 0;
  PRODUCT_CATEGORY_ELECTRONICS = 1;
  PRODUCT_CATEGORY_CLOTHING = 2;
  PRODUCT_CATEGORY_BOOKS = 3;
  PRODUCT_CATEGORY_HOME_GOODS = 4;
  PRODUCT_CATEGORY_FOOD = 5;
}

enum TransactionStatus {
  TRANSACTION_STATUS_UNKNOWN = 0;
  TRANSACTION_STATUS_INITIATED = 1;
  TRANSACTION_STATUS_COMMITTED = 2;
  TRANSACTION_STATUS_ROLLED_BACK = 3;
  TRANSACTION_STATUS_FAILED = 4;
}

message Money {
  int64 units = 1;
  int32 nanos = 2;
}

message OrderItem {
  string product_id = 1;
  int32 quantity = 2;
  Money unit_price = 3;
}

message Address {
  string street = 1;
  string city = 2;
  string state = 3;
  string zip_code = 4;
  string country = 5;
}

message Order {
  string order_id = 1;
  string user_id = 2;
  repeated OrderItem items = 3;
  Money total_amount = 4;
  google.protobuf.Timestamp order_date = 5;
  OrderStatus status = 6;
  Address shipping_address = 7;
  string transaction_id = 8;
  int32 retry_count = 9;

  oneof payment_details {
    string credit_card_token = 10;
    string paypal_email = 11;
  }
}

message PlaceOrderRequest {
  string user_id = 1;
  repeated OrderItem items = 2;
  Address shipping_address = 3;
  string idempotency_key = 4;
  string transaction_id = 5;

  oneof payment_details {
    string credit_card_token = 6;
    string paypal_email = 7;
  }
}

message OrderConfirmation {
  string order_id = 1;
  string message = 2;
  google.protobuf.Timestamp estimated_delivery_date = 3;
  string transaction_id = 4;
  TransactionStatus transaction_status = 5;
}

message GetOrderRequest {
  string order_id = 1;
}

message BookInventoryRequest {
  string booking_id = 1;
  repeated OrderItem items = 2;
  string user_id = 3;
  google.protobuf.Timestamp expiration_time = 4;
  string idempotency_key = 5;
}

message BookInventoryResponse {
  string booking_id = 1;
  bool success = 2;
  string message = 3;
  google.protobuf.Timestamp booking_expiration = 4;
  repeated string unavailable_products = 5;
}

message TransactionRequest {
  string transaction_id = 1;
  string order_id = 2;
  string booking_id = 3;
}

message TransactionResponse {
  string transaction_id = 1;
  TransactionStatus status = 2;
  string message = 3;
  google.protobuf.Timestamp timestamp = 4;
}

service UnaryOrderService {
  rpc PlaceOrder (PlaceOrderRequest) returns (OrderConfirmation);
  rpc GetOrderDetails (GetOrderRequest) returns (Order);
  rpc BookInventory (BookInventoryRequest) returns (BookInventoryResponse);
  rpc CommitTransaction (TransactionRequest) returns (TransactionResponse);
  rpc RollbackTransaction (TransactionRequest) returns (TransactionResponse);
}