name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Resolve dependencies
        run: mvn dependency:resolve

      - name: Make protoc executable
        run: |
            find ~/.m2 -name "protoc-*-linux-x86_64" \
            ! -name "*.jar" ! -name "*.sha1" ! -name "*.md5" \
            | xargs chmod +x 2>/dev/null || true

      - name: Build with Maven
        run: |
            mvn dependency:get -Dartifact=com.google.protobuf:protoc:4.29.4:exe:${{ runner.os == 'Windows' && 'windows-x86_64' || (runner.arch == 'ARM64' && 'linux-aarch_64' || 'linux-x86_64') }}
            find ~/.m2/repository/com/google/protobuf/protoc -type f -name "protoc-*" -exec chmod +x {} + || true
            mvn -B test

      - name: Generate JaCoCo Badge
        uses: cicirello/jacoco-badge-generator@v2
        with:
          generate-branches-badge: true

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

      - name: Show test failures
        if: failure()
        run: find . -name "*.txt" -path "*/surefire-reports/*" | xargs cat