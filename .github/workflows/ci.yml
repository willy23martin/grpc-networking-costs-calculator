name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Resolve dependencies
        run: mvn dependency:resolve

      - name: Debug protoc binary
        run: |
          echo "=== Looking for protoc binary ==="
          find ~/.m2 -name "protoc-*" ! -name "*.jar" ! -name "*.sha1" ! -name "*.md5" ! -name "*.asc" 2>/dev/null || echo "No protoc binary found"
          echo "=== OS info ==="
          uname -a
          echo "=== Java os.name and os.arch ==="
          java -XshowSettings:property -version 2>&1 | grep -E "os\.(name|arch)"

      - name: Make protoc executable
        run: |
          find ~/.m2 -name "protoc-*-linux-x86_64" \
            ! -name "*.jar" ! -name "*.sha1" ! -name "*.md5" \
            | xargs chmod +x 2>/dev/null || true

      - name: Build with Maven
        run: mvn test

      - name: Show surefire failure reports
        if: failure()
        run: |
          find . -name "*.txt" -path "*/surefire-reports/*" | xargs cat