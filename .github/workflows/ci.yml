name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Resolve dependencies
        run: mvn dependency:resolve

      - name: Make protoc executable
        run: |
          find ~/.m2 -name "protoc-*-linux-x86_64" \
            ! -name "*.jar" ! -name "*.sha1" ! -name "*.md5" \
            | xargs chmod +x 2>/dev/null || true

      - name: Build with Maven
        run: mvn clean install

      - name: Publish test coverage results
        uses: PavanMudigonda/jacoco-reporter@v4.8
        with:
          coverage_results_path: 'target/site/jacoco/jacoco.xml'
          coverage_report_title: 'Test coverage results'
          coverage_report_name: 'Test coverage results'
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Show test failures
        if: failure()
        run: find . -name "*.txt" -path "*/surefire-reports/*" | xargs cat